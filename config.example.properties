# Machine-specific paths. Copy this file to config.properties (git-ignored) and edit.
# Without config.properties the built-in defaults in tools/Config.java apply, so an
# existing checkout keeps working unchanged.
#
# Backslashes are fine; they are normalised to forward slashes.
# Only these four roots are needed -- everything else is derived, and the texture
# folders are discovered by walking these roots rather than being listed.

# Steam library root, the folder containing common/ and workshop/
steam.folder = E:/SteamLibrary/steamapps

# Civ VI Mods folder, normally under Documents
mods.folder = C:/Users/1132/Documents/My Games/Sid Meier's Civilization VI/Mods

# Folder name of the HD mod inside mods.folder. Note this is the *game-side* folder
# name, which is not the same as the GitHub repo name.
hd.mod.folder = Civ6HarmonyInDiversity

# The game Cache directory that `Main init` rebuilds the databases from. Usually
# %LOCALAPPDATA%/Firaxis Games/Sid Meier's Civilization VI/Cache, or a copy of it.
cache.source = E:/hdciv/backup/Cache
