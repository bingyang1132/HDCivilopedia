# Machine-specific paths. Copy this file to config.properties (git-ignored) and edit.
#
# Every value is optional: without config.properties the defaults in tools/Config.java apply,
# which are the stock install locations derived from the environment (%USERPROFILE%,
# %LOCALAPPDATA%). Run any command and `[CONFIG]` lines report roots that do not exist.
#
# Backslashes are fine; they are normalised to forward slashes. Only the roots below are
# needed -- everything else is derived, and the texture folders are discovered by walking
# these roots rather than being listed.

# Steam library root, the folder containing common/ and workshop/
# Default: C:/Program Files (x86)/Steam/steamapps
steam.folder = D:/SteamLibrary/steamapps

# Civ VI Mods folder
# Default: %USERPROFILE%/Documents/My Games/Sid Meier's Civilization VI/Mods
mods.folder = C:/Users/<你的用户名>/Documents/My Games/Sid Meier's Civilization VI/Mods

# Folder name of the HD mod inside mods.folder. Note this is the *game-side* folder name,
# which is not the same as the GitHub repo name.
hd.mod.folder = Civ6HarmonyInDiversity

# The game Cache directory that `Main init` rebuilds the databases from, or a copy of it.
# Default: %LOCALAPPDATA%/Firaxis Games/Sid Meier's Civilization VI/Cache
cache.source = C:/Users/<你的用户名>/AppData/Local/Firaxis Games/Sid Meier's Civilization VI/Cache

# Optional. Where each run snapshots its artifacts, into HDCivilopedia_<yyyyMMdd>/ -- one per
# day, the last run of the day wins, named to match archives made by hand. Diffing two of
# those is how changelog entries are derived (docs/roadmap.md). Leave it out and archiving is
# skipped; the folder must already exist. Costs ~65 MB per day: json/ verbatim plus the HTML
# zipped, minus icons and images.
archive.folder = D:/HDCivilopedia_history
